# Default configuration (mirrors the dataclass defaults in src/rbdsmc/config.py).
# Units are part of the key names. z = 0 is the hollow-core-fiber facet; gravity along -z.
# beam_up exits the fiber (+z); beam_down comes from above (-z), tilted by theta_rad in x-z.
# Mode list entries: {type: TEM00} | {type: LG, p: 0, l: 0, coeff: [re, im]} | {type: HG, m: 0, n: 0, coeff: [re, im]}
optics:
  wavelength_nm: 1064.0
  polarizability_au: 687.3
  theta_rad: 0.0
  phase_offset_rad: 0.0
  beam_up:
    power_W: 0.5
    waist_um: 20.0
    waist_z_mm: 0.0
    modes:
    - type: TEM00
  beam_down:
    power_W: 0.5
    waist_um: 20.0
    waist_z_mm: 0.0
    modes:
    - type: TEM00
fiber:
  core_radius_um: null
cloud:
  z_center_mm: 7.0
  diameter_mm: 2.0
  T0_uK: 4.0
  N0: 100000.0
  distribution: boltzmann
region:
  z_half_mm: 1.25
  rho_factor: 3.0
physics:
  gravity: true
  collisions: false
  photon_scattering: false
  gamma_bg_per_s: 0.0
  K3_cm6_per_s: 0.0
bands:
  s_min: 0.001
  s_max: 2000.0
  n_s: 600
  n_bands: 40
  n_planewaves: 60
numerics:
  n_test: 10000
  dt_us: 25.0
  t_end_ms: 200.0
  record_every: 20
  free_substeps: 10
  seed: 1
  init_slab_um: 40.0
  init_grid: 101
  init_margin_kT: 0.5
  init_band_cut_kT: 12.0
output:
  results_dir: results
  label: ''
